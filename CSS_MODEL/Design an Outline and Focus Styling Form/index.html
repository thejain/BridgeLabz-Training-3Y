<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Outline and Focus Styling Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Outline and Focus Styling Form</h1>
</header>
<main>
<form class="demo-form">
<label for="name">Name</label>
<input type="text" id="name" class="outline-solid" placeholder="Solid outline on focus">
<label for="email">Email</label>
<input type="text" id="email" class="outline-dashed" placeholder="Dashed outline on focus">
<label for="phone">Phone</label>
<input type="text" id="phone" class="outline-dotted" placeholder="Dotted outline with offset">
<label for="message">Message</label>
<textarea id="message" class="outline-double" placeholder="Double outline on focus"></textarea>
<button type="button">Submit</button>
</form>
</main>
</body>
</html>
