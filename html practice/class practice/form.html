<!DOCTYPE html>
<html lang="en"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
</head>
<body>
        
        <h1>Form</h1>

        <form>

            <label for="name">Name:</label>
            <input id="name" type="text" placeholder="Enter your name"name="name">

            <br><br>

            <label for="email">Email:</label>
            <input id="email" type="email" placeholder="Enter your email" name="email">

            <br><br>
            
            <label for="phone">Phone:</label>
            <input id="phone" type="number" placeholder="Enter your phone number" name="phone">
            
            <br><br>

            <label for="password">Password:</label>
            <input id="password" type="password" placeholder="Enter your password" name="password">
            <br><br>


            <label for="skill">Skill:</label>
            <select id="skill" name="skill" size="1">
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JS">JS</option>
            </select>

            <section>
                <label>Gender:</label>

                <input id="male" type="radio" name="gender" value="male" >
                <label for="male">Male</label>

                <input id="female" type="radio" name="gender" value="female"  >
                <label for="female">Female</label>

                <input id="other" type="radio" name="gender" value="other"  >
                <label for="other">Other</label>

            </section>

             
            <section name="Skills">
                <label>Skills:</label>
                <input type="checkbox" value="html">
                <label>HTML</label>
                <input type="checkbox" value="css">
                <label>CSS</label>
                <input type="checkbox" value="js">
                <label>JS</label>
            </section>

            <br>
            <lable for="date">Date</lable>
            <input id="date" type="date" name="date">
            <textarea>  </textarea>
            <br>

            <input type="file" name="file">
            <br>
            <input type="range" max="3">



           <button type="submit">Submit</button>
            <br>

            </form>
</body>

</html>
