<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ecd3d2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            width: 330px;
            background-color: rgb(255, 255, 255);
            padding: 32px;
            text-align: center;

            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .profile {
            width: 140px;
            height: 140px;

            background-color: #3110ee;
            border-radius: 50%;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #f7f1f1;
            font-size: 24px;
        }

        h1 {
            margin: 10px 0;
            font-size: 32px;
            color: #161516;
        }

        h2 {
            margin: 5px 0;
            font-size: 22px;
            color: #555;
        }

        .university {
            color: #777;
            font-size: 18px;
            margin-top: 10px;
        }

        .description {
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.6;
            color: #444;
        }

        h3 {
            margin-top: 25px;
            font-size: 22px;
            color: #444;
        }

        .skills a {
            color: #f00a34;
            font-size: 18px;
            margin: 3px;
            text-decoration: none;
        }

        .contact {
            margin-top: 25px;
            padding: 13px 28px;

            background-color: #2864e8;
            color: white;

            border: none;
            border-radius: 9px;

            font-size: 18px;
            cursor: pointer;
        }

        .contact:hover {
            background-color: #2b17c4;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">
            Student
        </div>

        <h1>Akshat Jain</h1>

        <h2>Computer Science Engineering</h2>

        <div class="university">
            GLA University
        </div>

        <p class="description">
            I am a passionate Computer Science
            student interested in Web Development,
            Java, and problem solving.
        </p>

        <h3>Skills</h3>

        <div class="skills">
            <a href="#">HTML</a>
            <a href="#">CSS</a>
            <a href="#">Java</a>
            <a href="#">Problem Solving</a>
        </div>

        <button class="contact">
            Contact Me
        </button>

    </div>

</body>
</html>
